# Publica la landing (carpeta landing/) en GitHub Pages en cada push a main que la modifique.
# Requiere, una vez: Settings → Pages → Source: "GitHub Actions".
name: Landing en GitHub Pages

on:
  push:
    branches: [main]
    paths: ["landing/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: landing
      - id: despliegue
        uses: actions/deploy-pages@v4
